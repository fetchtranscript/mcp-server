[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fetchtranscript-mcp"
version = "0.1.1"
description = "MCP server for FetchTranscript YouTube API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "FetchTranscript" }]
keywords = ["mcp", "youtube", "transcript", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.2,<2",  # 2.x renamed FastMCP: the server does not start on it
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.urls]
Homepage = "https://fetchtranscript.com"
Documentation = "https://fetchtranscript.com/docs/mcp"
Repository = "https://github.com/fetchtranscript/mcp-server"

[project.scripts]
fetchtranscript-mcp = "fetchtranscript_mcp.server:main"
